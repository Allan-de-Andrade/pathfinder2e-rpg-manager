<h2 mat-dialog-title>Deletar Personagem</h2>

<mat-dialog-content>
   Tem certeza que deseja deletar este personagem? Esta ação não pode ser desfeita.
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton mat-dialog-close>Não</button>
  <button matButton mat-dialog-close (click)="deleteCharacter()">Sim</button>
</mat-dialog-actions>
