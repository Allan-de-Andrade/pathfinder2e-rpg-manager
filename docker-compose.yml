services:
  postgresdb:
    image: postgres:latest
    restart: always
    container_name: rpg-manager-postgres-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - private_network
  backend:
    build: ./backend/rpg-manager
    container_name: rpg-manager-back-end
    env_file:
      - ./backend/rpg-manager/.env
    environment:
      - DB_HOST=postgresdb
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
    ports:
      - "${SPRING_PORT:-8080}:8080"
    depends_on:
      - postgresdb

    networks:
      - public_network
      - private_network
  frontend:
    build: ./frontend/rpg-manager
    container_name: rpg-manager-front-end
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - public_network
networks:
  public_network:
    driver: bridge
  private_network:
    driver: bridge
volumes:
  postgres_data:
